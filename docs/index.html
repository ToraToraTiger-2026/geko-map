<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- OSMのタイル利用条件でRefererの送信が必要なため、Referrer-Policyを絞りすぎない -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- 読み込みを許可する場所の制限（CSP）。タイル配信元を変えたら img-src も合わせて変更すること -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://*.supabase.co https://challenges.cloudflare.com https://msearch.gsi.go.jp https://nominatim.openstreetmap.org; frame-src https://challenges.cloudflare.com; base-uri 'none'; form-action 'none'">
  <title>下戸マップ</title>
  <meta name="description" content="お酒を飲まない人でも入りやすいお店を、みんなの匿名の投稿で探せる地図です。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="下戸マップ">
  <meta property="og:description" content="お酒を飲まない人でも入りやすいお店を、みんなの匿名の投稿で探せる地図です。">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 data-site-name>下戸マップ</h1>
    <p class="tagline">お酒を飲まなくても入りやすいお店</p>
    <a class="header-link" href="post-shop.html">お店を登録する</a>
  </header>

  <details class="filter-box" open>
    <summary>絞り込み</summary>
    <div id="filters" class="filters"></div>
  </details>

  <p id="status" class="status" role="status">読み込み中…</p>
  <form id="search-form" class="search-bar">
    <label for="search-q" class="search-label">場所を探す</label>
    <input id="search-q" type="text" maxlength="100" autocomplete="off" placeholder="住所または店名">
    <button id="search-button" type="submit" class="button small">移動</button>
  </form>
  <p id="search-status" class="status" role="status"></p>
  <ul id="search-results" class="search-results"></ul>
  <div id="map" class="map"></div>

  <footer class="site-footer">
    <p>お店の情報は利用者の投稿に基づくもので、正確性を保証しません。</p>
    <p><a href="terms.html">利用規約</a> ／ <a href="privacy.html">プライバシーポリシー</a> ／ <a href="delete-request.html">削除依頼</a></p>
  </footer>

  <dialog id="dialog" class="dialog"><div id="dialog-body"></div></dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/supabase-js/supabase.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
