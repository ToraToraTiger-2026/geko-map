<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- OSMのタイル利用条件でRefererの送信が必要なため、Referrer-Policyを絞りすぎない -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- 読み込みを許可する場所の制限（CSP）。タイル配信元を変えたら img-src も合わせて変更すること -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>下戸マップ</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 data-site-name>下戸マップ</h1>
    <p class="tagline">お酒を飲まなくても入りやすいお店</p>
  </header>

  <details class="filter-box" open>
    <summary>絞り込み</summary>
    <div id="filters" class="filters"></div>
  </details>

  <p id="status" class="status" role="status">読み込み中…</p>
  <div id="map" class="map"></div>

  <footer class="site-footer">
    <p>お店の情報は利用者の投稿に基づくもので、正確性を保証しません。</p>
    <p><a href="terms.html">利用規約</a> ／ <a href="privacy.html">プライバシーポリシー</a></p>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
